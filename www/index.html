<title>核单</title>
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#1b2430; --muted:#5b6472;
  --rule:#c7d0dc; --rule-strong:#9fb0c6; --accent:#2451a3; --accent-soft:#e3ebf8;
  --good:#1f7a4d; --good-soft:#e5f4ec; --bad:#c23b3b; --bad-soft:#fbeaea;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161f; --surface:#1a2030; --surface-2:#20273a; --ink:#e8ecf4; --muted:#9aa5b8;
    --rule:#333e54; --rule-strong:#4a5878; --accent:#6f9be8; --accent-soft:#213257;
    --good:#5cc994; --good-soft:#173427; --bad:#f08080; --bad-soft:#3a2124;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', -apple-system, sans-serif; margin:0; padding:24px 16px 60px; max-width:980px; margin-inline:auto;}
.num{font-family:'Space Mono','SF Mono',monospace; font-variant-numeric:tabular-nums;}
h1{font-family:'Space Mono',monospace; font-size:1.5rem; margin:0 0 4px;}
.sub{color:var(--muted); font-size:0.9rem; margin:0 0 22px;}

.summary-bar{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px;}
.stat{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:12px 16px; flex:1 1 140px; min-width:140px;}
.stat .label{font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;}
.stat .value{font-family:'Space Mono',monospace; font-size:1.25rem;}
.stat.grand{border-color:var(--accent); background:var(--accent-soft);}
.status-pill{display:inline-flex; align-items:center; gap:6px; font-family:'Space Mono',monospace; font-weight:700;}
.status-pill.ok{color:var(--good);} .status-pill.err{color:var(--bad);}
.dot{width:8px; height:8px; border-radius:50%; background:currentColor;}

.ledger{background:var(--surface); border:1px solid var(--rule); border-radius:12px; margin-bottom:22px; overflow:hidden;}
.ledger-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px; border-bottom:1px solid var(--rule); background:var(--surface-2); flex-wrap:wrap;}
.ledger-head input.title{font-family:'Space Mono',monospace; font-size:1.05rem; background:transparent; border:none; color:var(--ink); width:160px;}
.ledger-head input.title:focus{outline:1px solid var(--accent); border-radius:4px;}

.photo-zone{padding:12px 18px; border-bottom:1px dashed var(--rule); display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start;}
.photo-drop{border:1.5px dashed var(--rule-strong); border-radius:10px; padding:14px; text-align:center; color:var(--muted); font-size:0.82rem; cursor:pointer; flex:1 1 160px; min-width:160px; background:var(--surface-2);}
.photo-drop:hover{border-color:var(--accent); color:var(--accent);}
.photo-card{position:relative; width:110px;}
.photo-card img{width:110px; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--rule); display:block; cursor:zoom-in;}
.photo-card button.rm{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; border:none; background:var(--bad); color:#fff; font-size:12px; line-height:1; cursor:pointer; padding:0;}
.photo-card .ocr-status{font-size:0.66rem; margin-top:4px; text-align:center; color:var(--muted);}
.photo-card .ocr-status.busy{color:var(--accent);}
.photo-card .ocr-status.ok{color:var(--good);}
.photo-card .ocr-status.err{color:var(--bad);}
.backend-bar{padding:8px 18px; border-bottom:1px dashed var(--rule); font-size:0.76rem; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.backend-bar input{font-family:'Space Mono',monospace; font-size:0.76rem; padding:3px 6px; border:1px solid var(--rule); border-radius:5px; background:var(--surface-2); color:var(--ink); width:170px;}

.table-scroll{overflow-x:auto;}
table{width:100%; border-collapse:collapse; min-width:680px;}
thead th{text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:600; padding:10px; border-bottom:1px solid var(--rule-strong); white-space:nowrap;}
thead th.num-col{text-align:right;}
tbody td{padding:6px 10px; border-bottom:1px solid var(--rule); vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
td.num-col{text-align:right;}
input.cell{width:60px; text-align:right; font-family:'Space Mono',monospace; font-size:0.88rem; color:var(--ink); background:var(--surface-2); border:1px solid var(--rule); border-radius:6px; padding:5px 6px;}
input.cell:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
input.cell.wide{width:80px;}
input.desc{width:100%; min-width:140px; font-family:inherit; font-size:0.88rem; color:var(--ink); background:var(--surface-2); border:1px solid var(--rule); border-radius:6px; padding:5px 8px;}
input.printed{background:transparent; border-color:transparent; color:var(--muted);}
input.printed:focus{background:var(--surface-2); border-color:var(--accent); color:var(--ink);}
.computed{font-family:'Space Mono',monospace;}
.badge{display:inline-block; font-family:'Space Mono',monospace; font-size:0.76rem; padding:2px 8px; border-radius:999px;}
.badge.ok{background:var(--good-soft); color:var(--good);}
.badge.bad{background:var(--bad-soft); color:var(--bad);}
button.rmrow{border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:1rem;}
button.rmrow:hover{color:var(--bad);}
tfoot td{padding:12px 10px; font-family:'Space Mono',monospace; font-weight:700; border-top:2px solid var(--rule-strong);}
tfoot td.num-col{text-align:right;}

.row-controls{padding:10px 18px; border-top:1px solid var(--rule);}
.controls{display:flex; gap:10px; margin:6px 0 30px; flex-wrap:wrap;}
button{font-family:'IBM Plex Sans',sans-serif; font-size:0.85rem; font-weight:600; padding:8px 14px; border-radius:8px; border:1px solid var(--rule-strong); background:var(--surface); color:var(--ink); cursor:pointer;}
button:hover{border-color:var(--accent); color:var(--accent);}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
button.primary:hover{opacity:0.9; color:#fff;}
button.ghost{border-style:dashed;}
footer{color:var(--muted); font-size:0.8rem; padding-top:10px; border-top:1px solid var(--rule); text-align:center;}
.lightbox{position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:50; padding:24px;}
.lightbox.show{display:flex;}
.lightbox img{max-width:100%; max-height:100%; border-radius:8px;}
.tip{font-size:0.76rem; color:var(--muted); padding:6px 18px 14px;}
.import-zone{padding:12px 18px; border-bottom:1px dashed var(--rule);}
.import-zone textarea{width:100%; min-height:70px; font-family:'Space Mono',monospace; font-size:0.82rem; padding:8px 10px; border:1px solid var(--rule); border-radius:8px; background:var(--surface-2); color:var(--ink); resize:vertical;}
.import-zone .row{display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap;}
.import-zone .hint{font-size:0.74rem; color:var(--muted);}
.import-msg{font-size:0.78rem; margin-left:6px;}
.import-zone{display:none}
.import-msg.ok{color:var(--good);} .import-msg.bad{color:var(--bad);}
/* ===== iOS 26 Liquid Glass ===== */
:root{padding-top:0!important;}
body{padding-top:calc(env(safe-area-inset-top,0px) + 14px)!important;}
:root{
  --bg:#e9eefb; --surface:rgba(255,255,255,.55); --surface-2:rgba(255,255,255,.45); --ink:#10141f; --muted:#5d6678;
  --rule:rgba(120,130,160,.22); --rule-strong:rgba(120,130,160,.35); --accent:#0a84ff; --accent-soft:rgba(10,132,255,.14);
  --good:#1fa463; --good-soft:rgba(48,209,88,.16); --bad:#e5383b; --bad-soft:rgba(255,69,58,.14);
  --glass:rgba(255,255,255,.52); --edge:rgba(255,255,255,.75); --shadow:0 10px 30px rgba(40,60,120,.14);

}

  --bg:#05070d; --surface:rgba(40,46,66,.45); --surface-2:rgba(255,255,255,.07); --ink:#f2f5fc; --muted:#98a2b8;
  --rule:rgba(255,255,255,.10); --rule-strong:rgba(255,255,255,.18); --accent:#4aa3ff; --accent-soft:rgba(74,163,255,.2);
  --good:#46d68c; --good-soft:rgba(48,209,88,.18); --bad:#ff6b6b; --bad-soft:rgba(255,69,58,.2);
  --glass:rgba(38,44,64,.42); --glass-solid:rgba(30,36,54,.78); --edge:rgba(255,255,255,.22); --shadow:0 12px 34px rgba(0,0,0,.45);
}}
html{background-color:var(--bg);
  background-image:radial-gradient(42% 30% at 18% 12%, rgba(10,132,255,.5), transparent 70%),
   radial-gradient(38% 28% at 88% 22%, rgba(191,90,242,.42), transparent 70%),
   radial-gradient(45% 32% at 70% 88%, rgba(48,209,200,.38), transparent 70%),
   radial-gradient(40% 30% at 8% 80%, rgba(255,159,10,.3), transparent 70%);
  background-attachment:fixed;}
body{min-height:100vh; font-family:-apple-system,'SF Pro Display','SF Pro Text',system-ui,sans-serif; background:transparent; padding:max(18px,env(safe-area-inset-top)) 14px 90px; -webkit-font-smoothing:antialiased; position:relative;}
body::before{content:""; position:fixed; inset:-10%; z-index:-1; pointer-events:none;
  background:
   radial-gradient(42% 30% at 18% 12%, rgba(10,132,255,.55), transparent 70%),
   radial-gradient(38% 28% at 88% 22%, rgba(191,90,242,.45), transparent 70%),

@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.08);}}
.num,.status-pill,.stat .value,input.cell,.computed,tfoot td,.badge,.ledger-head input.title{font-family:'SF Mono','Menlo',ui-monospace,monospace;}
h1{font-size:2.1rem; font-weight:800; letter-spacing:-.03em; margin:6px 4px 2px;}
.sub{margin:0 4px 18px; font-size:.88rem;}

.stat,.ledger,.backend-bar{background:var(--glass); border:1px solid var(--edge); border-radius:26px;
  -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.08);}
.summary-bar{gap:10px; margin-bottom:14px;}
.stat{padding:14px 16px; border-radius:24px; min-width:130px; transition:transform .5s var(--spring);}
.stat:active{transform:scale(.97);}
.stat .label{letter-spacing:.04em; text-transform:none; font-size:.76rem;}
.stat .value{font-size:1.4rem; font-weight:700;}
.stat.grand{flex-basis:100%; background:linear-gradient(135deg,var(--accent-soft),var(--glass)); border-color:var(--edge); position:relative; overflow:hidden;}
.stat.grand::after{content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 66%); transform:translateX(-120%); animation:sheen 5s ease-in-out infinite; pointer-events:none;}
@keyframes sheen{60%,100%{transform:translateX(120%);}}
.status-pill{font-size:1.15rem; padding:4px 12px 4px 10px; border-radius:999px; background:var(--surface-2);}
.status-pill.ok{background:var(--good-soft); box-shadow:0 0 22px rgba(48,209,88,.35);}
.status-pill.err{background:var(--bad-soft); box-shadow:0 0 22px rgba(255,69,58,.3);}
.status-pill.ok .dot,.status-pill.err .dot{animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{50%{transform:scale(1.7); opacity:.45;}}

.backend-bar{padding:12px 16px; margin-bottom:14px; border-radius:22px;}

.backend-bar input{width:100%; border-radius:14px; padding:10px 12px; font-size:.85rem; background:var(--surface-2); border:1px solid var(--rule);}

.ledger{margin-bottom:16px; -webkit-backdrop-filter:none; backdrop-filter:none; background:var(--glass-solid);}
@keyframes rise{from{transform:translateY(18px) scale(.98);}}
.ledger-head{background:transparent; border-bottom:1px solid var(--rule); padding:14px 18px;}
.ledger-head input.title{font-size:1.02rem; font-weight:700; width:auto; flex:1; min-width:0;}
.photo-zone{border-bottom:1px solid var(--rule);}
.photo-drop{border-radius:20px; border:1.5px dashed var(--accent); color:var(--accent); background:var(--accent-soft); font-weight:600; transition:transform .4s var(--spring);}
.photo-drop:active{transform:scale(.96);}
.photo-card img{border-radius:18px; border:1px solid var(--edge); box-shadow:0 6px 16px rgba(0,0,0,.18);}
.photo-card button.rm{width:24px; height:24px; top:-8px; right:-8px; background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid var(--edge);}
.photo-card .ocr-status.busy{animation:blink 1.2s ease-in-out infinite;}

.tip{padding:8px 18px;}

button{font-family:inherit; border-radius:999px; padding:10px 18px; font-weight:600; background:var(--glass); border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%);
  box-shadow:0 4px 14px rgba(40,60,120,.12), inset 0 1px 0 rgba(255,255,255,.5); color:var(--ink); transition:transform .45s var(--spring), box-shadow .3s;}
button:hover{color:var(--ink); border-color:var(--edge);}
button:active{transform:scale(.93);}
button.primary{background:linear-gradient(180deg,#3b9cff,#0a6fe0); color:#fff; border-color:rgba(255,255,255,.45); box-shadow:0 8px 22px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.55);}
button.ghost{border-style:solid; color:var(--accent);}
.controls{margin:4px 0 24px;}

input.cell,input.desc{border-radius:12px; background:var(--surface-2); border:1px solid var(--rule); transition:box-shadow .25s,border-color .25s;}

.badge{padding:3px 10px; font-weight:600;}
.badge.bad{animation:pop .5s var(--spring);}
@keyframes pop{from{transform:scale(.6);}}
tbody tr{transition:background .2s;}
tbody td,thead th{border-color:var(--rule);}
tfoot td{border-top:1px solid var(--rule-strong);}
footer{border:none; opacity:.7;}
.lightbox{-webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px); background:rgba(0,0,0,.55);}
.lightbox img{border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,.5);}

button.rmrow{background:transparent!important; border:none!important; box-shadow:none!important; -webkit-backdrop-filter:none; backdrop-filter:none; padding:6px 10px; color:var(--muted);}
.ledger-head button.rmrow{color:var(--bad);}

.controls{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 20px;}
.controls button{width:100%; padding:13px 10px; font-size:.92rem; white-space:nowrap; text-align:center;}
.controls button.primary{grid-column:1/-1; padding:15px 10px; font-size:1.02rem; letter-spacing:.02em;}
.controls button.danger{color:var(--bad);}
footer{margin-top:8px; padding-bottom:12px;}
#toast{position:fixed; left:14px; right:14px; top:calc(env(safe-area-inset-top,0px) + 10px); z-index:99; padding:14px 18px; border-radius:24px;

#toast.show{transform:none;} #toast b{font-size:.95rem; color:var(--ink);} #toast span{font-size:.82rem; color:var(--muted);}
/* 手机：紧凑表格，不横向滚动 */
@media (max-width:640px){

    tfoot td{font-size:.8rem; padding:9px 2px; border-top:1px solid var(--rule-strong); border-bottom:none; background:var(--accent-soft);}

/* ===== 表格 v3：去框、斑马纹、异常行高亮 ===== */
@media (max-width:640px){

.photo-btns{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.pbtn{flex:1 1 auto; padding:10px 12px; font-size:.82rem; border-radius:14px; min-width:104px;}
.pbtn.cam{background:linear-gradient(180deg,#3b9cff,#0a6fe0); color:#fff; border-color:rgba(255,255,255,.45);}
.photo-card{width:132px;}
.photo-card img{width:132px; height:132px;}
.photo-card .retry{display:none; width:100%; margin-top:4px; padding:6px 4px; font-size:.7rem; border-radius:10px; color:var(--accent);}
.photo-card .retry.show{display:block;}

.fxrow{display:flex; gap:18px; flex-wrap:wrap; margin-top:2px; font-size:.84rem;}
.fxrow label{display:flex; align-items:center; gap:6px; cursor:pointer;}
.fxrow input{width:18px; height:18px; accent-color:var(--accent);}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
</style>

</head>
<body>

<h1>核单</h1>
<p class="sub">拍照 → AI 识别填表 → 自动核对差额（识别结果请对照照片复核）</p>

<div class="summary-bar" id="summaryBar"></div>

<div class="backend-bar" style="flex-direction:column;align-items:stretch">
<details id="cfg"><summary style="cursor:pointer;font-weight:600">⚙ AI 设置（Base URL / Key / 模型）</summary>
<div style="display:grid;gap:6px;margin-top:8px">
<input type="text" id="aiBase" placeholder="Base URL，如 https://api.openai.com/v1" style="width:100%">
<input type="password" id="aiKey" placeholder="API Key" style="width:100%">
<input type="text" id="aiModel" placeholder="必须是视觉模型，如 gpt-4o / gemini-2.5-flash / qwen-vl（deepseek 不支持图片）" style="width:100%">
<div><button id="aiTest">测试连接</button> <span id="aiMsg"></span></div>
<div class="fxrow"><label><input type="checkbox" id="fxHaptic" checked> 振动反馈</label><label><input type="checkbox" id="fxSound" checked> 音效反馈</label></div>
<div class="hint">Key 只存在本机；照片只在识别时发给你填的接口。</div></div></details></div>

<div id="ledgers"></div>

<div class="controls">
  <button class="primary" id="addPageBtn">＋ 新增一页</button>
  <button id="clearDiffBtn">单据金额 = 计算值</button>
</div>

<footer>数据与照片仅保存在本机。</footer>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<script>try{window.__PRESEED__=JSON.parse(localStorage.hedanData||"null");}catch(e){window.__PRESEED__=null;}</script>
<script>
(function(){
  var ledgersEl = document.getElementById('ledgers');
  var summaryEl = document.getElementById('summaryBar');
  var fmt = new Intl.NumberFormat('es-AR');
  var pageCount = 0;

  summaryEl.innerHTML =
    '<div class="stat"><div class="label">计算总额</div><div class="value num" id="grandCalc">0</div></div>' +
    '<div class="stat"><div class="label">单据总额</div><div class="value"><input class="cell wide printed" style="font-size:1.05rem;width:100%;" type="number" step="1" id="grandPrinted" value="0"></div></div>' +
    '<div class="stat grand" style="display:flex;flex-direction:column;justify-content:center;"><div class="label">核对结果</div><div id="grandStatus" class="status-pill"></div></div>';
  document.getElementById('grandPrinted').addEventListener('input', recalcAll);

  function newPage(printedDefault){
    pageCount++;
    var pid = 'pg' + pageCount;
    var wrap = document.createElement('section');
    wrap.className = 'ledger';
    wrap.id = pid;
    ledgersEl.appendChild(wrap);

    wrap.innerHTML =
      '<div class="ledger-head">' +
        '<input class="title" value="第 ' + pageCount + ' 页">' +
        '<button class="rmrow" data-act="rmpage" style="font-size:1.1rem;">✕ 删除本页</button>' +
      '</div>' +
      '<div class="photo-zone">' +
        '<div class="photo-drop" style="cursor:default">上传/拍照单据（留作对照）' +
        '<div class="photo-btns">' +
          '<button type="button" class="pbtn cam" data-act="snap">📷 拍照</button>' +
          '<button type="button" class="pbtn" data-act="pick">🖼 相册/文件</button>' +
        '</div>' +
        '<input type="file" accept="image/*" multiple style="display:none" data-act="filein"></div>' +
        '<div class="photo-list" style="display:flex; gap:10px; flex-wrap:wrap;"></div>' +
      '</div>' +
      '<div class="import-zone">' +
        '<div class="hint">把单据拍照发给 Claude，让它读出内容并按下面格式回复给你，然后粘贴到这里一键导入：</div>' +
        '<div class="hint" style="margin:4px 0 6px;">格式：每行一项，用逗号分隔品名和数字，谁先谁后都行 —— 会自动把第一个数字当数量、最后两个数字当单价和金额（只有两个数字时，金额=数量×单价）。品名认不出来也没关系，留空一样能导入，核对主要看数字。Pyto 识别结果和手打的都能用。</div>' +
        '<textarea placeholder="例如（品名在前）：\nFamiliar x580,2,4150,8300\nChico x400,3,2900,8700\n\n或（数量在前，Vision 识别常是这个顺序）：\n2,Familiar x580,4150,8300"></textarea>' +
        '<div class="row"><button data-act="import">导入这些行</button><span class="import-msg"></span></div>' +
      '</div>' +
      '<div class="tip">导入后再对照照片核对一遍数字，确认无误。</div>' +
      '<div class="table-scroll"><table>' +
        '<thead><tr><th class="num-col">数量</th><th>描述</th><th class="num-col">单价</th><th class="num-col">计算金额</th><th class="num-col">单据金额</th><th class="num-col">差额</th><th></th></tr></thead>' +
        '<tbody></tbody>' +
        '<tfoot><tr><td colspan="3">页面合计</td>' +
          '<td class="num-col" id="' + pid + '-calcTotal">0</td>' +
          '<td class="num-col"><input class="cell wide printed" type="number" step="1" id="' + pid + '-printedTotal" value="' + (printedDefault||0) + '"></td>' +
          '<td class="num-col" id="' + pid + '-totalDiff">–</td><td></td>' +
        '</tr></tfoot>' +
      '</table></div>' +
      '<div class="row-controls"><button class="ghost" data-act="addrow">+ 添加一行</button></div>';

    wrap.querySelector('[data-act="rmpage"]').addEventListener('click', function(){
      wrap.remove(); recalcAll();
    });
    wrap.querySelector('[data-act="addrow"]').addEventListener('click', function(){
      addRow(pid, {d:'', q:'', p:'', imp:''});
    });
    wrap.querySelector('[data-act="filein"]').addEventListener('change', function(e){
      var picked = Array.prototype.slice.call(e.target.files);   // 先复制：下一行清空 value 会把活的 FileList 一起清掉
      e.target.value = '';
      handleFiles(pid, picked);
    });
    wrap.querySelector('[data-act="pick"]').addEventListener('click', function(){
      wrap.querySelector('[data-act="filein"]').click();
    });
    wrap.querySelector('[data-act="snap"]').addEventListener('click', function(){
      fx('soft');
      var status = document.createElement('span'); status.className='ocr-status busy'; status.textContent='打开相机…';
      snapPhoto().then(function(res){
        if(!res.ok) throw new Error(res.error==='cancel'?'已取消':(res.error||'打不开相机'));
        addPhotoAsNewPage(pid, res.data);
        nativeCall({op:'clearPending'});
      }).catch(function(e){
        if(e.message!=='已取消') alert('拍照失败：'+e.message+'\n可以改用「相册/文件」。');
      });
    });
    wrap.querySelector('[data-act="import"]').addEventListener('click', function(){
      importText(pid, wrap.querySelector('.import-zone textarea'), wrap.querySelector('.import-msg'));
    });
    document.getElementById(pid + '-printedTotal').addEventListener('input', recalcAll);

    return pid;
  }

  function addRow(pid, item){
    var tbody = document.querySelector('#' + pid + ' tbody');
    var rid = pid + '-r' + (tbody.children.length + '-' + Date.now());
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="num-col"><input class="cell" type="number" step="1" id="' + rid + '-q" value="' + (item.q||'') + '"></td>' +
      '<td><input class="desc" type="text" id="' + rid + '-d" value="' + (item.d||'') + '" placeholder="品名"></td>' +
      '<td class="num-col"><input class="cell wide" type="number" step="1" id="' + rid + '-p" value="' + (item.p||'') + '"></td>' +
      '<td class="num-col computed" id="' + rid + '-calc">0</td>' +
      '<td class="num-col"><input class="cell wide printed" type="number" step="1" id="' + rid + '-imp" value="' + (item.imp||'') + '"></td>' +
      '<td class="num-col" id="' + rid + '-diff">–</td>' +
      '<td><button class="rmrow" title="删除此行">✕</button></td>';
    tbody.appendChild(tr);
    ['q','p','imp'].forEach(function(s){
      document.getElementById(rid + '-' + s).addEventListener('input', recalcAll);
    });
    tr.querySelector('.rmrow').addEventListener('click', function(){ tr.remove(); recalcAll(); });
    recalcAll();
  }

  function nativeCall(msg){
    return new Promise(function(res){
      if(!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native)){
        return res({ok:false,error:'这个功能只能在 App 里用'});
      }
      var id='c'+Date.now()+Math.random().toString(36).slice(2);
      __cbs[id]=res; msg.id=id;
      try{window.webkit.messageHandlers.native.postMessage(msg);}catch(e){res({ok:false,error:e.message});}
    });
  }
  function snapPhoto(){ return nativeCall({op:'camera'}); }

  // 把一张图(dataURL)加进这一页：缩略图 + 状态 + 重试按钮，并开始识别

  // 一张图 = 一页(一张单子)。当前页是空白页就复用，否则新建一页，避免多张单子混在同一张表里。
  function isBlankPage(pid){
    var w=document.getElementById(pid); if(!w) return false;
    if(w.querySelector('.photo-card')) return false;
    var any=false;
    w.querySelectorAll('tbody tr').forEach(function(tr){
      var q=tr.querySelector('input[id$="-q"]').value,p=tr.querySelector('input[id$="-p"]').value,d=tr.querySelector('input.desc').value,i=tr.querySelector('input[id$="-imp"]').value;
      if(q||p||d||i) any=true;
    });
    var pt=document.getElementById(pid+'-printedTotal');
    if(pt&&parseFloat(pt.value)) any=true;
    return !any;
  }
  function pageForNewPhoto(prefPid){
    if(prefPid&&isBlankPage(prefPid)) return prefPid;
    var last=document.querySelectorAll('.ledger'); last=last.length?last[last.length-1].id:null;
    if(last&&isBlankPage(last)) return last;
    var pid=newPage(0);
    addRow(pid,{d:'',q:'',p:'',imp:''});
    return pid;
  }
  function addPhotoAsNewPage(prefPid,dataUrl){
    var pid=pageForNewPhoto(prefPid);
    addPhoto(pid,dataUrl);
    return pid;
  }

  function addPhoto(pid, dataUrl){
    var list=document.querySelector('#'+pid+' .photo-list');
    var card=document.createElement('div');
    card.className='photo-card';
    card.innerHTML='<img src="'+dataUrl+'"><button class="rm" title="移除">✕</button>'+
      '<div class="ocr-status"></div><button class="retry" title="重新识别">↻ 重试识别</button>';
    card.__src=dataUrl; card.__key='ph'+Date.now()+Math.random().toString(36).slice(2);
    list.appendChild(card);
    card.querySelector('img').addEventListener('click',function(){
      document.getElementById('lightboxImg').src=dataUrl;
      document.getElementById('lightbox').classList.add('show');
    });
    card.querySelector('.rm').addEventListener('click',function(){ card.remove(); });
    shrink(dataUrl,360).then(function(t){ card.__thumb=t; });
    var st=card.querySelector('.ocr-status');
    card.querySelector('.retry').addEventListener('click',function(){
      card.querySelector('.retry').classList.remove('show');
      sendToBackend(pid, null, st, dataUrl, card.__key);
    });
    sendToBackend(pid, dataUrl, st, dataUrl, card.__key);
  }

  var __seenFiles={};
  function handleFiles(pid, files){
    var list=Array.prototype.slice.call(files).filter(function(file){
      // 同一张照片（文件名+大小+修改时间都一样）已经加过就跳过，避免手滑重复
      var fp=file.name+'|'+file.size+'|'+(file.lastModified||0);
      if(__seenFiles[fp]) return false; __seenFiles[fp]=true; return true;
    });
    // 逐张读入、按顺序处理，保证页面顺序与选择顺序一致
    list.reduce(function(chain,file){
      return chain.then(function(){
        return new Promise(function(res){
          var reader=new FileReader();
          reader.onload=function(e){ addPhotoAsNewPage(pid,e.target.result); res(); };
          reader.onerror=function(){ res(); };
          reader.readAsDataURL(file);
        });
      });
    },Promise.resolve());
  }

  function num(v){
    if(v===null||v===undefined||v==='') return null;
    if(typeof v==='number') return v;
    var t=String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',', '.');
    var n=parseFloat(t); return isNaN(n)?null:n;
  }
  // 模型偶发用别的字段名(price/amount/qty/name)，统一成 d/q/p/imp
  // 判断一行是不是「没订」：没有数量、或金额栏是 STOCK / NO HAY 之类
  var NOHAY=/^\s*(stock|no\s*hay|nohay|sin\s*stock|agotado|falta|no|n\/h|缺货|没有|无)\s*$/i;
  function isSkippedRow(raw,n){
    var impRaw=raw.imp!==undefined?raw.imp:(raw.amount!==undefined?raw.amount:raw.importe);
    if(typeof impRaw==='string'&&NOHAY.test(impRaw)) return true;
    if(!n.q||n.q<=0) return true;           // 没有数量 = 没订
    return false;
  }
  function normRow(r){
    var pick=function(){for(var i=0;i<arguments.length;i++){var k=arguments[i]; if(r[k]!==undefined&&r[k]!==null&&r[k]!=='') return r[k];} return null;};
    var q=num(pick('q','qty','quantity','cantidad'));
    var p=num(pick('p','price','unit','unitPrice','precio'));
    var imp=num(pick('imp','amount','total','importe','subtotal'));
    if(q&&!p&&imp) p=Math.round(imp/q);
    if(q&&p&&!imp) imp=Math.round(q*p);
    return {d:String(pick('d','desc','description','name','producto')||''), q:q, p:p, imp:imp};
  }
  function shrink(dataUrl,max){
    return new Promise(function(res){var im=new Image();im.onload=function(){
      var k=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.8));};im.src=dataUrl;});
  }

  // POST the raw image bytes to the local Pyto OCR backend; on success, append the
  // recognized text into this page's import textarea so the user can review + import.
  var __cbs={};
  window.__nativeReply=function(id,o){var f=__cbs[id];if(f){delete __cbs[id];f(o);}};
  function httpPost(url,headers,body){
    if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native){
      return new Promise(function(res){var id='h'+Date.now()+Math.random();__cbs[id]=res;
        window.webkit.messageHandlers.native.postMessage({id:id,url:url,headers:headers,body:body});});
    }
    return fetch(url,{method:'POST',headers:headers,body:body}).then(function(r){return r.text().then(function(t){return {ok:true,status:r.status,text:t};});})
      .catch(function(e){return {ok:false,error:e.message};});
  }
  function cfg(){return {base:(localStorage.aiBase||'').trim().replace(/\/+$/,''),key:(localStorage.aiKey||'').trim(),model:(localStorage.aiModel||'').trim()};}
  function reqBody(c,messages){
    var b={model:c.model,messages:messages,temperature:0,max_tokens:2000};
    if(/deepseek/i.test(c.base)) b.thinking={type:'disabled'};   // DeepSeek 默认开思考，识图不需要，关掉快很多
    return b;
  }
  function aiCall(messages){
    var c=cfg();
    if(!c.base||!c.key||!c.model) return Promise.reject(new Error('请先在「AI 设置」填 Base URL / Key / 模型'));
    var url=/\/chat\/completions$/.test(c.base)?c.base:c.base+'/chat/completions';
    return httpPost(url,{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      JSON.stringify(reqBody(c,messages))).then(function(r){
        if(!r.ok) throw new Error(r.error||'网络错误');
        var j; try{j=JSON.parse(r.text);}catch(e){throw new Error('HTTP '+r.status+' '+r.text.slice(0,120));}
        if(r.status>=300) throw new Error('HTTP '+r.status+' '+((j.error&&j.error.message)||r.text.slice(0,120)));
        return j.choices[0].message.content;
      });
  }
  function notify(title,body){
    var t=document.getElementById('toast');
    if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
    t.innerHTML='<b>'+title+'</b><span>'+body+'</span>'; t.className='show'+(/有 IVA/.test(body)?' iva':'');
    try{window.webkit.messageHandlers.native.postMessage({op:'notify',title:title,body:body});}catch(e){}
    clearTimeout(window.__tt); window.__tt=setTimeout(function(){t.className='';},6000);
  }
  var PROMPT='你是手写订货单/送货单(Nota de Pedido, 阿根廷, 西班牙语)识别器。读图，只输出一个 JSON，不要解释、不要代码块。格式：'+
   '{"date":"日期","customer":"客户名或空","rows":[{"d":"品名","q":数量,"p":单价,"imp":单据上写的金额}],"subtotal":IVA之前的小计或null,"iva":单据上写出的IVA金额或null,"hasIva":单据是否加了IVA(true/false),"total":页底TOTAL金额,"unsure":[有疑问的行序号从0起]}。'+
   '规则：1)数字用整数，千分点去掉(21.920=21920)。2)被划掉/没有金额的行不要输出。3)只照抄单据上写的数，绝不自己计算或纠正；看不清的 imp 或 p 就填 null 并把行号放进 unsure。'+
   '4)底部的小计、IVA(21%)等单独金额行不要放进 rows：小计填 subtotal，IVA 金额填 iva(只抄写的数)，有 IVA 则 hasIva=true，最终 TOTAL 填 total。5)圈起来的小数字是标记，不是数量。'+
   '6)版式：最左窄列是数量(手写，常写在品名左边)，中间列是单价，最右列是金额。先按列定位再读数，不要把单价和金额搞反。'+
   '7)数量(q)必须是单据上手写出来的数字，绝不能自己补 1 或估计。数量栏空白、写横线「-」「—」、或看不清时，q 填 null。'+
   '只有单价、没有数量的行，或金额栏写 STOCK / NO HAY / NO / 没有 / 缺货 的行，是「没订这件」，不要输出到 rows。'+
   '数量和单价都有而金额看不清时，imp 才可以填 q×p；有数量和金额但单价看不清，p 填 imp÷q。'+
   '8)完全空白、没写字迹的行不要输出。9)品名按单据原文，不要翻成中文。';
  function sendToBackend(pid, file, statusEl, dataUrl, srcKey){
    statusEl.className='ocr-status busy'; statusEl.textContent='AI 识别中…';
    shrink(dataUrl,1500).then(function(img){
      return aiCall([{role:'user',content:[{type:'text',text:PROMPT},{type:'image_url',image_url:{url:img}}]}]);
    }).then(function(txt){
      var m=txt.match(/\{[\s\S]*\}/); if(!m) throw new Error('返回里没有 JSON：'+txt.slice(0,80));
      var o=JSON.parse(m[0]);
      var skipped=0;
      var rows=(o.rows||[]).map(function(r){var n=normRow(r); n.__skip=isSkippedRow(r,n); return n;}).filter(function(n){ if(n.__skip) skipped++; return !n.__skip; });
      var uns=[];   // unsure 序号是按原始行给的，过滤后会错位，这里改为只靠本地检查标黄
      window.__skipped=skipped;
      var wrap=document.getElementById(pid);
      var tb=wrap.querySelector('tbody');
      Array.prototype.slice.call(tb.children).forEach(function(tr){var q=tr.querySelector('input[id$="-q"]').value,p=tr.querySelector('input[id$="-p"]').value,d=tr.querySelector('input.desc').value; if(!q&&!p&&!d) tr.remove();});
      if(srcKey){ Array.prototype.slice.call(tb.querySelectorAll('tr[data-src="'+srcKey+'"]')).forEach(function(tr){tr.remove();}); }
      var start=tb.children.length;
      rows.forEach(function(r,i){
        addRow(pid,{d:r.d||'',q:r.q,p:r.p,imp:r.imp});
        if(r.p==null||r.imp==null||(r.q&&r.p&&r.imp&&r.q*r.p!==r.imp)) tb.children[start+i].classList.add('warn');
        if(srcKey) tb.children[start+i].dataset.src=srcKey;
      });
      if(o.total!=null) document.getElementById(pid+'-printedTotal').value=o.total;
      var calc=0; rows.forEach(function(r){calc+=(Number(r.q)||0)*(Number(r.p)||0);});
      var tot=Number(o.total)||0, ivaW=(o.iva==null?null:Number(o.iva));
      var hasIva=(o.hasIva===true)||(ivaW!=null&&ivaW>0)||(tot>calc&&calc>0&&Math.abs(tot-calc*1.21)<=2);
      var ivaMsg;
      if(hasIva){
        var calcIva=Math.round(calc*0.21), amt=(ivaW!=null&&ivaW>0)?ivaW:((tot>calc)?(tot-calc):calcIva);
        addRow(pid,{d:'IVA 21%',q:1,p:amt,imp:amt});
        var ir=tb.lastElementChild; ir.classList.add('iva'); if(srcKey) ir.dataset.src=srcKey;
        var off=Math.abs(amt-calcIva)>1;
        
        ivaMsg='有 IVA，已自动加入 '+fmt.format(amt)+(off?'（与 21% 不符，请复核）':'');
      } else { ivaMsg='单据没有 IVA'; }
      window.__ivaMsg=ivaMsg;
      var t=wrap.querySelector('.ledger-head input.title');
      if(t&&(o.customer||o.date)) t.value=[o.customer,o.date].filter(Boolean).join(' · ');
      var g=0;document.querySelectorAll('.ledger [id$="-printedTotal"]').forEach(function(x){g+=parseFloat(x.value)||0;});
      document.getElementById('grandPrinted').value=g;
      recalcAll();
      statusEl.className='ocr-status ok'; statusEl.textContent='已识别 '+rows.length+' 行'+(window.__skipped?('，跳过 '+window.__skipped+' 行没订的'):'')+(rows.some(function(r){return r.p==null||r.imp==null;})?'（黄色行请复核）':'');
      var gs=document.getElementById('grandStatus');
      fx(gs.classList.contains('ok')?'success':'warning');
      notify('识别完成：'+rows.length+' 行', window.__ivaMsg+'；'+gs.textContent.replace(/\s+/g,' ').trim());
    }).catch(function(err){
      statusEl.className='ocr-status err';statusEl.textContent='识别失败：'+err.message+(/超时|timed out/i.test(err.message)?'（该接口可能不支持图片，请换视觉模型并点「测试连接」确认）':'');
      var rc=statusEl.parentNode&&statusEl.parentNode.querySelector('.retry'); if(rc) rc.classList.add('show');
      fx('error');});
  }

  // 不假设"品名"和"数量"谁在前谁在后——按每个逗号分隔的片段自动分类：
  // 整段"从头到尾全是数字"的进 nums（避免把 "x580" 这种品名里夹的数字
  // 误判成金额），其余（品名、勾号✓、杠线之类的识别噪音）进 words。
  // 数字按出现顺序：第一个当数量，最后两个当单价、金额（只有两个数字时，
  // 金额 = 数量×单价）。品名认不出来没关系，核对靠的是数字——只要这一行
  // 凑出数字就留下，品名留空，之后自己对照照片补/不补都行。
  function parseImportLine(line){
    var parts = line.split(/[,，;；]+/).map(function(s){ return s.trim(); }).filter(function(s){ return s !== ''; });
    var nums = [], words = [];
    parts.forEach(function(tok){
      if(/^-?\d+(\.\d+)?$/.test(tok)){
        nums.push(parseFloat(tok));
      } else {
        words.push(tok);
      }
    });
    if(nums.length === 0) return null; // 一个数字都没有，没法核对，跳过
    var d = words.join(' ').trim();
    var q, p, imp;
    if(nums.length >= 3){
      q = nums[0]; p = nums[nums.length - 2]; imp = nums[nums.length - 1];
    } else if(nums.length === 2){
      q = nums[0]; p = nums[1]; imp = q * p;
    } else {
      q = nums[0]; p = 0; imp = 0;
    }
    return { d: d, q: q, p: p, imp: imp };
  }

  function importText(pid, textarea, msgEl){
    var raw = textarea.value.trim();
    if(!raw){ msgEl.className = 'import-msg bad'; msgEl.textContent = '请先粘贴内容'; return; }
    var lines = raw.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    // 按"解析出来的内容"（品名+数量+单价+金额）去重，而不是按原始文字去重——
    // 拍同一张照片识别两次，或单据本身有两份一样的联单，识别出来的噪音符号
    // 未必逐字相同，但真正的数据是一样的，这样也能挡住。
    var seen = {};
    var added = 0, skipped = 0, duped = 0;
    lines.forEach(function(line){
      var row = parseImportLine(line);
      if(!row){ skipped++; return; }
      var key = row.d.toLowerCase().replace(/\s+/g,'') + '|' + row.q + '|' + row.p + '|' + row.imp;
      if(seen[key]){ duped++; return; }
      seen[key] = true;
      addRow(pid, row);
      added++;
    });
    if(added){
      var extras = [];
      if(duped) extras.push('去掉 ' + duped + ' 行重复的');
      if(skipped) extras.push('跳过 ' + skipped + ' 行一个数字都没有的');
      msgEl.className = 'import-msg ok';
      msgEl.textContent = '已导入 ' + added + ' 行' + (extras.length ? '，' + extras.join('，') : '') + '，请核对数量和金额是否正确';
      textarea.value = '';
    } else {
      msgEl.className = 'import-msg bad';
      msgEl.textContent = '没能解析出任何一行，每行至少要有一个数字';
    }
  }

  document.getElementById('lightbox').addEventListener('click', function(){
    this.classList.remove('show');
  });

  function recalcAll(){
    var grandCalc = 0;
    var grandPrinted = parseFloat(document.getElementById('grandPrinted').value) || 0;
    var allOk = true;
    var anyRow = false;

    document.querySelectorAll('.ledger').forEach(function(wrap){
      var pid = wrap.id;
      var pageCalc = 0;
      wrap.querySelectorAll('tbody tr').forEach(function(tr){
        anyRow = true;
        var qInput = tr.querySelector('input.cell:nth-of-type(1), input[id$="-q"]');
        var pInput = tr.querySelector('input[id$="-p"]');
        var impInput = tr.querySelector('input[id$="-imp"]');
        var calcCell = tr.querySelector('[id$="-calc"]');
        var diffCell = tr.querySelector('[id$="-diff"]');
        var q = parseFloat(qInput.value) || 0;
        var p = parseFloat(pInput.value) || 0;
        var imp = impInput.value === '' ? null : (parseFloat(impInput.value) || 0);
        var calc = q * p;
        pageCalc += calc;
        calcCell.textContent = fmt.format(calc);
        tr.classList.toggle('iva', /^\s*iva\b/i.test(tr.querySelector('input.desc').value));
        tr.classList.remove('bad');
        if(imp!==null && calc-imp!==0) tr.classList.add('bad');
        if(imp === null){
          diffCell.innerHTML = '<span class="badge">–</span>';
        } else {
          var diff = calc - imp;
          if(diff === 0){
            diffCell.innerHTML = '<span class="badge ok">✓<span class="bt"> 一致</span></span>';
          } else {
            diffCell.innerHTML = '<span class="badge bad">' + (diff > 0 ? '+' : '') + fmt.format(diff) + '</span>';
            allOk = false;
          }
        }
      });

      grandCalc += pageCalc;
      var calcTotalEl = document.getElementById(pid + '-calcTotal');
      if(calcTotalEl) calcTotalEl.textContent = fmt.format(pageCalc);
      var printedTotalInput = document.getElementById(pid + '-printedTotal');
      var totalDiffCell = document.getElementById(pid + '-totalDiff');
      if(printedTotalInput && totalDiffCell){
        var printedTotal = parseFloat(printedTotalInput.value) || 0;
        var totalDiff = pageCalc - printedTotal;
        if(totalDiff === 0){
          totalDiffCell.innerHTML = '<span class="badge ok">✓<span class="bt"> 相符</span></span>';
        } else {
          totalDiffCell.innerHTML = '<span class="badge bad">' + (totalDiff > 0 ? '+' : '') + fmt.format(totalDiff) + '</span>';
          allOk = false;
        }
      }
    });

    document.getElementById('grandCalc').textContent = fmt.format(grandCalc);
    var __prevOk=window.__lastOk;
    var grandDiff = grandCalc - grandPrinted;
    var statusEl = document.getElementById('grandStatus');
    if(!anyRow){
      statusEl.className = 'status-pill';
      statusEl.innerHTML = '<span class="dot"></span>等待录入';
    } else if(grandDiff === 0 && allOk){
      statusEl.className = 'status-pill ok';
      statusEl.innerHTML = '<span class="dot"></span>全部核对通过';
      if(__prevOk===false) fx('success');
      window.__lastOk=true;
    } else {
      window.__lastOk=false;
      statusEl.className = 'status-pill err';
      statusEl.innerHTML = '<span class="dot"></span>差 ' + (grandDiff > 0 ? '+' : '') + fmt.format(grandDiff);
    }
  }

  document.getElementById('addPageBtn').addEventListener('click', function(){
    var pid = newPage(0);
    addRow(pid, {d:'', q:'', p:'', imp:''});
  });

  document.getElementById('clearDiffBtn').addEventListener('click', function(){
    document.querySelectorAll('.ledger').forEach(function(wrap){
      var pid = wrap.id;
      var pageCalc = 0;
      wrap.querySelectorAll('tbody tr').forEach(function(tr){
        var q = parseFloat(tr.querySelector('input[id$="-q"]').value) || 0;
        var p = parseFloat(tr.querySelector('input[id$="-p"]').value) || 0;
        var impInput = tr.querySelector('input[id$="-imp"]');
        impInput.value = q * p;
        pageCalc += q * p;
      });
      var pt = document.getElementById(pid + '-printedTotal');
      if(pt) pt.value = pageCalc;
    });
    // 不要从显示文字反解（es-AR 的千分位是「.」，会把 954.600 读成 954.6），直接按各页数字累加
    var gc = 0;
    document.querySelectorAll('.ledger').forEach(function(w){
      w.querySelectorAll('tbody tr').forEach(function(tr){
        gc += (parseFloat(tr.querySelector('input[id$="-q"]').value)||0) * (parseFloat(tr.querySelector('input[id$="-p"]').value)||0);
      });
    });
    document.getElementById('grandPrinted').value = gc;
    recalcAll();
  });

  // If a Pyto session pre-seeded OCR text (one page per photo, raw text in the import box),
  // build those pages; otherwise start with a single blank page.
  if (window.__PRESEED__ && window.__PRESEED__.length) {
    // v2：预置数据支持逐行填充（item.rows），并写入单据总额；照片可内嵌为 item.photo
    var grand = 0;
    window.__PRESEED__.forEach(function(item){
      var pid = newPage(item.printed || 0);
      grand += (item.printed || 0);
      var titleInput = document.querySelector('#' + pid + ' .ledger-head input.title');
      if (titleInput && item.title) titleInput.value = item.title;
      var ta = document.querySelector('#' + pid + ' .import-zone textarea');
      if (ta) ta.value = item.text || '';
      var rows = item.rows || [];
      if (item.photo) {
        var pl = document.querySelector('#' + pid + ' .photo-list');
        pl.innerHTML = '<div class="photo-card"><img src="' + item.photo + '"></div>';
      }
      rows.forEach(function(r){ addRow(pid, r); });
      if (!rows.length) addRow(pid, {d:'', q:'', p:'', imp:''});
    });
    document.getElementById('grandPrinted').value = grand;
    recalcAll();
    window.__READY__ = true;
  } else {
    var firstPid = newPage(0);
    addRow(firstPid, {d:'', q:'', p:'', imp:''});
  }


  // ===== 振动 + 音效反馈 =====
  var fxLast=0;
  function fx(kind){
    var h=localStorage.fxHaptic!=='0', so=localStorage.fxSound!=='0';
    if(!h&&!so) return;
    var now=Date.now(); if(now-fxLast<45) return; fxLast=now;   // 防止连点时堵塞
    try{window.webkit.messageHandlers.native.postMessage({op:'fx',kind:kind,haptic:h,sound:so});}catch(e){}
  }
  window.fx=fx;
  ['fxHaptic','fxSound'].forEach(function(id){
    var el=document.getElementById(id), k=id==='fxHaptic'?'fxHaptic':'fxSound';
    el.checked=localStorage[k]!=='0';
    el.addEventListener('change',function(){localStorage[k]=el.checked?'1':'0'; if(el.checked) fx('select');});
  });
  // 按钮：主按钮 soft，普通 tap，删除类 warning
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button,summary,.photo-card img');
    if(!b) return;
    if(b.classList.contains('rm')||b.classList.contains('rmrow')||b.id==='nb'||/清空/.test(b.textContent||'')) fx('warning');
    else if(b.classList.contains('primary')||b.classList.contains('cam')) fx('soft');
    else fx('tap');
  },true);
  // 输入框获得焦点：轻微选择反馈
  document.addEventListener('focusin',function(e){ if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&e.target.type!=='checkbox') fx('select'); });
  ['aiBase','aiKey','aiModel'].forEach(function(k){var el=document.getElementById(k);el.value=localStorage[k]||'';el.addEventListener('input',function(){localStorage[k]=el.value;});});
  if(!cfg().base) document.getElementById('cfg').open=true;
  document.getElementById('aiTest').addEventListener('click',function(){
    var m=document.getElementById('aiMsg');m.textContent='测试中（含图片）…';
    var c=document.createElement('canvas');c.width=240;c.height=90;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,240,90);x.fillStyle='#000';x.font='bold 56px sans-serif';x.fillText('7421',40,66);
    var t0=Date.now();
    aiCall([{role:'user',content:[{type:'text',text:'图里的数字是多少？只回答数字。'},{type:'image_url',image_url:{url:c.toDataURL('image/png')}}]}]).then(function(t){
      var sec=Math.round((Date.now()-t0)/1000);
      m.textContent=/7421/.test(t)?('✓ 支持图片（'+sec+' 秒）'):('✗ 能连通但没读出图片，该模型可能不支持视觉：'+t.slice(0,30));
    }).catch(function(e){m.textContent='✗ '+e.message;});
  });
  // 本机保存：页面数据 + 缩略图
  function snap(){
    var out=[];document.querySelectorAll('.ledger').forEach(function(w){
      var pid=w.id,rows=[];
      w.querySelectorAll('tbody tr').forEach(function(tr){rows.push({d:tr.querySelector('input.desc').value,q:tr.querySelector('input[id$="-q"]').value,p:tr.querySelector('input[id$="-p"]').value,imp:tr.querySelector('input[id$="-imp"]').value});});
      var pc=w.querySelector('.photo-card'), im=pc&&pc.querySelector('img');
      var ph=pc?(pc.__thumb||(im&&im.src.length<200000?im.src:'')):'';
      out.push({title:w.querySelector('input.title').value,printed:parseFloat(document.getElementById(pid+'-printedTotal').value)||0,rows:rows,photo:ph});
    });return out;
  }
  window.__saveSnap=function(){try{localStorage.hedanData=JSON.stringify(snap());}catch(e){console.log('save fail',e&&e.message);}};
  document.addEventListener('input',function(){clearTimeout(window.__st);window.__st=setTimeout(window.__saveSnap,500);});
  document.addEventListener('click',function(){clearTimeout(window.__st);window.__st=setTimeout(window.__saveSnap,800);});
  var nb=document.createElement('button');nb.textContent='清空全部，开始新单';nb.className='danger';
  nb.onclick=function(){if(confirm('清空当前所有页面？')){localStorage.removeItem('hedanData');location.reload();}};
  document.querySelector('.controls').appendChild(nb);
  setTimeout(window.__saveSnap,1500);
  // 如果上次拍完照页面被系统回收，照片还留在原生侧：取回来继续识别
  setTimeout(function(){
    nativeCall({op:'takePending'}).then(function(res){
      if(!res.ok||!res.data) return;
      var wraps=document.querySelectorAll('.ledger'); if(!wraps.length) return;
      addPhotoAsNewPage(wraps[wraps.length-1].id, res.data);
      nativeCall({op:'clearPending'});
    });
  },700);
})();
</script>
